apiVersion: v2
# MUST stay distinct from the OCI chart's Chart.yaml `name:` (unifi-ipmanager,
# published from the merged unifi-ipmanager app repo). helmfile's
# output-dir-template groups rendered manifests by chart name, not release
# name -- two charts with the same internal name in the same namespace
# silently overwrite each other's output in the same git commit.
name: unifi-ipmanager-data
description: Unifi IP Manager — Vault-backed app secrets (the app itself, both API and UI, is published separately as the unifi-ipmanager OCI chart).

type: application

version: 0.1.0

appVersion: "0.0.0"

dependencies:
- name: common
  version: 4.4.0
  repository: https://bjw-s-labs.github.io/helm-charts
